name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ping:1})\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_FLY_TOKEN == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.HAS_FLY_TOKEN == 'true'

      - name: Deploy to Fly.io
        if: env.HAS_FLY_TOKEN == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Skip deploy (no token configured)
        if: env.HAS_FLY_TOKEN != 'true'
        run: echo "FLY_API_TOKEN repository secret is not configured yet — skipping deploy."

  deploy-frontend:
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_pSS1uHov6otHe7vY2dqQ0twi
      VERCEL_PROJECT_ID: prj_sEYIvvKFnmNuTJQcMBAG5UgaaNBE
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_VERCEL_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_VERCEL_TOKEN == 'true'
        with:
          node-version: '22'

      - name: Install Vercel CLI
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: npm install --global vercel@56.2.0

      # Build locally (not on Vercel) so the tracked frontend/.env.production
      # — which carries VITE_API_BASE_URL — is read from this checkout. The
      # Vercel project defines no env vars of its own.
      - name: Pull Vercel project settings
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: vercel pull --yes --environment=production

      - name: Build
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: vercel build --prod

      - name: Deploy to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: vercel deploy --prebuilt --prod

      - name: Skip deploy (no token configured)
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: echo "VERCEL_TOKEN repository secret is not configured yet — skipping frontend deploy."
